<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGAS Configuration</title>

    <!-- Tailwind CDN (kept in case you want to use Tailwind classes somewhere else) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* GENERAL PAGE STYLE */
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 40px 0;
            margin: 0;
        }

        h1 {
            margin-bottom: 2rem !important;
            text-align: center !important;
            color:#4f46e5; !important;
            font-size: 2.4rem !important;
            font-weight: 800 !important;
            letter-spacing: 0.5px !important;
        }


        h2 {
            margin-bottom: 1.2rem;
            font-size: 1.6rem;
            color: #1a1a1a;
        }

        /* SECTIONS */
        .section {
            background: #ffffff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            border: 1px solid #e3e3e3;
            margin-bottom: 40px;
            width: 600px;
        }

        .section-title {
            color: #4f46e5;
            font-weight: 600;
        }

        /* LABELS */
        .label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: #555;
        }

        /* INPUT FIELDS */
        .input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #bfbfbf;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 0.95rem;
            background: #fff;
        }

        .input:focus {
            border-color: #4f46e5;
            outline: none;
            box-shadow: 0 0 3px rgba(79,70,229,0.5);
        }

        /* BUTTON */
        button {
            padding: 12px 32px !important;
            background: #4f46e5 !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            font-weight: 600 !important;
            font-size: 1rem !important;
            cursor: pointer !important;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15) !important;
            transition: background 0.2s ease-in-out !important;
        }

        button:hover {
            background: #2618c5ff;       /* um pouco mais escuro */
            color: white;
        }


        /* CONTAINER */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Make the whole page scrollable if needed */
        html, body {
            height: auto;
        }
    </style>
</head>
<body>

<div>
    <h1>AGAS Configuration Wizard</h1>

    <form method="POST" enctype="multipart/form-data">

        <!-- ========== ONTOLOGY SETTINGS ========== -->
        <div class="section">
            <h2 class="section-title">Ontology Settings</h2>

            <label class="label">Ontology File (.ttl, .owl)</label>
            <input type="file" name="ontology_file" class="input" accept=".ttl,.owl">

            <label class="label">Ontology Type</label>
            <select name="ontology_type" class="input">
                <option value="A">A (Table-like)</option>
                <option value="B">B (More complex, modular)</option>
                <option value="C1">C1 (Arquival, with media)</option>
                <option value="C2">C2 (Arquival, no media)</option>
            </select>

            <label class="label">Allow Editing To All?</label>
            <select name="ontology_edit" class="input">
                <option value="true">Yes</option>
                <option value="false">No</option>
            </select>

            <label class="label">Include Ontology Images Folder - optional</label>
            <input type="file" name="ontology_images" class="input" webkitdirectory directory>
        </div>

        <!-- ========== PAGE SETTINGS ========== -->
        <div class="section">
            <h2 class="section-title">Page Structure & Modules</h2>

            <label class="label">AGAS Website Name</label>
            <input type="text" name="agas_name" class="input" placeholder="Greek Deities Explorer">

            <!--label class="label">Page Style</label>
            <select name="agas_background" class="input">
                <option value="PAGES">Default style</option>
                <option value="BLOG">Blog-like style</option>
            </select>

            <label class="label">Background Image (optional)</label>
            <input type="file" name="background_image" class="input" accept=".png,.jpeg"-->

            <label class="label">Site Disposition (layout)</label>
            <select name="l_disposition" class="input">
                <option value="up">Vertical Navigation</option>
                <option value="side">Top Navigation</option>
            </select>

            <label class="label">About the Ontology (.md file) - optional</label>
            <input type="file" name="about" class="input" accept=".md">
        </div>

        <!-- ========== USER INFO ========== -->
        <div class="section">
            <h2 class="section-title">User Info</h2>

            <label class="label">Name</label>
            <input type="text" name="username" class="input" placeholder="Your Name/Username">

            <label class="label">User Type</label>
            <select name="user_type" class="input">
                <option value="EXP">EXP</option>
                <option value="NONEXP">NONEXP</option>
            </select>

            <label class="label">Language</label>
            <select name="language" class="input">
                <option value="EN">EN</option>
                <option value="PT">PT</option>
            </select>
        </div>

        <!-- SUBMIT -->
        <div style="text-align:center; margin-top: 30px;">
            <button type="submit">Save Configuration & Launch AGAS</button>
        </div>

    </form>
</div>

</body>
</html>
